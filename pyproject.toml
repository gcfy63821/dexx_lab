[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexx"
version = "0.1.0"
description = "Dex-X: dexterous manipulation RL (Sharpa Wave + Franka FR3) with sim2real, built on Isaac Lab."
readme = "README.md"
requires-python = ">=3.10,<3.11"
# Installed separately against the Isaac Lab stack: see requirements.txt and
# tutorial/00_setup (setup_env.sh / setup_uv.sh).
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["dexx*"]

[tool.setuptools.package-data]
"dexx.tasks.franka_sharpa.agents" = ["*.yaml"]
