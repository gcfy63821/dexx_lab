# PPO config for franka-sharpa-force-critic-horizon.
# Copy of dexmanip_ppo_cfg.yaml with priv_info_dim enlarged for K-frame
# critic future horizon (K=5 by default; see FrankaSharpaCriticHorizonCfg).
# MUST keep `algorithm.priv_info_dim` in sync with cfg.priv_info_dim.
seed: 42
algo: PPO
device: cuda
network:
  mlp:
    units: [256, 512, 128, 64]
  priv_mlp:
    # Unused by ActorCriticAsymmetric (critic uses raw priv_info concat),
    # but kept self-consistent: last dim equals priv_info_dim.
    units: [256, 128, 148]
  asymmetric_ac: true

load_path: None

algorithm:
  experiment_name: 'dexmanip_critic_horizon'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: 4096
  normalize_advantage: True
  gamma: 0.99
  tau: 0.95
  learning_rate: 2e-4
  kl_threshold: 0.008
  # PPO batch collection
  horizon_length: 32
  minibatch_size: 1024
  mini_epochs: 5
  # PPO loss setting
  clip_value: True
  critic_coef: 2
  entropy_coef: 0.0001
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  # grad clipping
  truncate_grads: True
  grad_norm: 1.0
  # snapshot setting
  save_best_after: 0
  save_frequency: 500
  max_agent_steps: 5500000000
  # privileged info (asymmetric critic)
  priv_info: True
  priv_info_dim: 148    # 40 + 18*K + 18 for K=5; MUST match cfg.priv_info_dim
  priv_info_embed_dim: 148  # Legacy field (not read by ActorCriticAsymmetric)

  # Teacher model configuration (retained for compatibility with ppo.py plumbing;
  # not used unless a teacher-student script is invoked)
  teacher_path: ""   # set me: no checkpoint ships for this legacy config
  teacher_proprio_adapt: False
  teacher_network:
    mlp:
      units: [256, 512, 128, 64]
    priv_mlp:
      units: [256, 128, 40]

  student_proprio_adapt: False
  teacher_loss_weight: 1.0
  reward_loss_weight: 0.1
  temperature: 3.0
  use_value_distill: False
