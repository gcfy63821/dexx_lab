seed: 42
algo: PPO
device: cuda
network:
  mlp:
    units: [256, 512, 128, 64]
  priv_mlp:
    # units: [256, 128, 8]
    # units: [256, 512, 128, 64]
    units: [256, 128, 40]
  # Asymmetric Actor-Critic: separate actor (deployable obs only) and critic (obs + priv_info)
  # Set to true to enable. Requires env cfg asymmetric_ac=True as well.
  asymmetric_ac: true

load_path: None # path to the checkpoint to load

algorithm:
  experiment_name: 'dexmanip'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: 4096 #16384
  normalize_advantage: True
  gamma: 0.99
  tau: 0.95
  # learning_rate: 5e-3
  learning_rate: 2e-4
  kl_threshold: 0.008 #0.02
  # PPO batch collection
  horizon_length: 32 #32 #8
  minibatch_size: 1024 #1024 #32768
  mini_epochs: 5
  # PPO loss setting
  clip_value: True
  critic_coef: 2
  entropy_coef: 0.0001 # was 0.0
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  # grad clipping
  truncate_grads: True
  grad_norm: 1.0
  # snapshot setting
  save_best_after: 0
  save_frequency: 500
  max_agent_steps: 5500000000
  # hora setting
  priv_info: True
  priv_info_dim: 40
  priv_info_embed_dim: 40

  # Teacher model configuration
  teacher_path: ""   # set me: no checkpoint ships for this legacy config
  teacher_proprio_adapt: False  # Whether teacher uses ProprioAdapt
  teacher_network:  # Optional: teacher network config (if different from default)
    mlp:
      units: [256, 512, 128, 64]
    priv_mlp:
      units: [256, 128, 40]
  
  # Student model configuration
  student_proprio_adapt: False  # Whether student uses ProprioAdapt
  
  # Distillation loss weights
  teacher_loss_weight: 1.0  # Weight for teacher-student distillation loss
  reward_loss_weight: 0.1   # Weight for environment reward loss
  temperature: 3.0           # Temperature for softmax in distillation
  use_value_distill: False  # Whether to distill value function
  

